name: Deploy E-commerce Example to EC2

# ──────────────────────────────────────────────────────────────────────────────
# Builds the e-commerce example app (ecommerce-app submodule) and runs it on the
# Notify EC2 host on port 8090, next to the main stack. nginx in the main stack
# (notify-ai-org/notify-ai, deploy/nginx/conf.d/notify.conf) forwards
# https://<host>/ecommerce/* to it.
#
# Secrets: EC2_HOST, EC2_USERNAME, EC2_SSH_KEY (same host as the main stack) and
# CHECKOUT_PAT (repo + read:packages, for the submodule checkout and image pulls
# on EC2). Requires the main stack to be deployed already.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'ecommerce-app'       # submodule pointer
      - 'deploy/ecommerce/**'
      - '.github/workflows/deploy-ecommerce.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ecommerce
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ecommerce-app
  CONTAINER: ecommerce-app
  PORT: 8090
  BASE_PATH: /ecommerce
  PROJECT: notify-examples
  DEPLOY_DIR: /opt/notify-examples/ecommerce
  # Written by the main stack's deploy; holds the ECOMMERCE_* settings.
  ENV_FILE: /opt/vocab-agent/deploy/ec2.env

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate deploy secrets
        env:
          CHECKOUT_PAT: ${{ secrets.CHECKOUT_PAT }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          for name in CHECKOUT_PAT EC2_HOST EC2_USERNAME EC2_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "ERROR: secret $name is not set on this repository."
              missing=1
            fi
          done
          exit $missing

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.CHECKOUT_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The storefront is compiled with the path prefix nginx serves it under.
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/ecommerce/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_BASE_PATH=${{ env.BASE_PATH }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=ecommerce
          cache-to: type=gha,mode=max,scope=ecommerce

      - name: Prepare EC2 deploy directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p ${{ env.DEPLOY_DIR }}
            sudo chown -R "${USER}:${USER}" ${{ env.DEPLOY_DIR }}

      - name: Copy Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/ecommerce/docker-compose.yml"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            printf '%s' '${{ secrets.CHECKOUT_PAT }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            cd ${{ env.DEPLOY_DIR }}
            if [ ! -f "${{ env.ENV_FILE }}" ]; then
              echo "ERROR: ${{ env.ENV_FILE }} does not exist. Deploy the main stack first."
              exit 1
            fi
            if ! docker network inspect vocab-agent_default > /dev/null 2>&1; then
              echo "ERROR: network vocab-agent_default does not exist. Deploy the main stack first."
              exit 1
            fi

            export ECOMMERCE_IMAGE='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
            COMPOSE="docker compose -p ${{ env.PROJECT }} --env-file ${{ env.ENV_FILE }} -f docker-compose.yml"

            # Free space before downloading layers; images used by running containers are kept.
            docker image prune -af

            $COMPOSE pull ${{ env.CONTAINER }}

            # The container was previously part of the main stack's Compose project;
            # remove that one so this project can take over the name.
            OWNER=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' ${{ env.CONTAINER }} 2>/dev/null || true)
            if [ -n "$OWNER" ] && [ "$OWNER" != "${{ env.PROJECT }}" ]; then
              echo "Removing ${{ env.CONTAINER }} owned by Compose project '$OWNER'"
              docker rm -f ${{ env.CONTAINER }}
            fi

            $COMPOSE up -d ${{ env.CONTAINER }}

            sleep 3
            if ! docker ps --filter name=${{ env.CONTAINER }} --format "{{.Names}}" | grep -q "^${{ env.CONTAINER }}$"; then
              echo "ERROR: Container failed to start or crashed on startup!"
              docker logs ${{ env.CONTAINER }}
              exit 1
            fi

            docker image prune -af --filter "until=24h"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "── Container status ──"
            docker ps -a --filter name=${{ env.CONTAINER }} --format "table {{.ID}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "── Health check ──"
            URL="http://localhost:${{ env.PORT }}${{ env.BASE_PATH }}/api/products"
            # Wait up to 60s for the app to start responding
            for i in $(seq 1 12); do
              if curl -sf "$URL" > /dev/null 2>&1; then
                echo "✓ E-commerce app is serving on port ${{ env.PORT }}"
                exit 0
              fi
              echo "  Waiting for app to start... (attempt $i/12)"
              sleep 5
            done
            echo "✗ E-commerce app did not respond at $URL in time"
            docker logs --tail 50 ${{ env.CONTAINER }}
            exit 1
